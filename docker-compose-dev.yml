services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-physio}/physio-tracker:${IMAGE_TAG:-latest}
    container_name: physio-app
    restart: unless-stopped
    ports:
      - "8080:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    volumes:
      - physio-data:/app/data
      - physio-uploads:/app/uploads

volumes:
  physio-data:
  physio-uploads:
