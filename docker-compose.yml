# Copy this file to your server along with the .env file
# Run with: docker compose pull && docker compose up -d

services:
  app:
    image: ${DOCKERHUB_USERNAME:-physio}/physio-tracker:${IMAGE_TAG:-latest}
    container_name: physio-app
    restart: unless-stopped
    ports:
      - "8080:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    volumes:
      - physio-data:/app/data
      - physio-uploads:/app/uploads

volumes:
  physio-data:
  physio-uploads:
