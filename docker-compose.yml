services:
  backend:
    build: ./backend
    container_name: physio-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=production
    volumes:
      - physio-data:/app/data
      - physio-uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: physio-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  physio-data:
  physio-uploads:
